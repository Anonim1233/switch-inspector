# ═══════════════════════════════════════════════════════════════════════
# Локальный запуск всего приложения: база, сервер, интерфейс.
#
#   cp .env.example .env   — заполнить JWT_SECRET и PGPASSWORD
#   docker compose up -d
#
# Интерфейс будет доступен на http://localhost:8080
# ═══════════════════════════════════════════════════════════════════════
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PGDATABASE:-switch_inventory}
      POSTGRES_USER: ${PGUSER:-switch_inventory}
      POSTGRES_PASSWORD: ${PGPASSWORD:?нужно задать PGPASSWORD в .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Файлы схемы выполняются при первом создании базы, по порядку имён.
      # Ограничения целостности сюда НЕ включены намеренно: их нужно
      # добавлять после проверки данных, см. database/04-check-*.sql
      - ./database/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/02-indexes.sql:/docker-entrypoint-initdb.d/02-indexes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-switch_inventory}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: 3000
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-switch_inventory}
      PGUSER: ${PGUSER:-switch_inventory}
      PGPASSWORD: ${PGPASSWORD}
      JWT_SECRET: ${JWT_SECRET:?нужно задать JWT_SECRET в .env}
      APP_URL: ${APP_URL:-http://localhost:8080}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    # Наружу интерфейс не выводится: обращения идут через прокси,
    # который обеспечивает защищённое соединение. Прямой доступ
    # к порту означал бы передачу паролей открытым текстом.
    depends_on:
      - backend
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    ports:
      # 80 нужен не только для перенаправления: по нему проходит
      # проверка владения доменом при получении сертификата.
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Сертификаты сохраняются между перезапусками: иначе при каждом
      # старте запрашивались бы заново, а у поставщика есть ограничение
      # на число запросов.
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    environment:
      # Домен, на который выпускается сертификат. Для проверки
      # без домена подойдёт :80 — соединение будет незащищённым.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  db-data:
  caddy-data:
  caddy-config:
  caddy-logs:
