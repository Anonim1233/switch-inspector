<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Switch Inspector</title>
  <link rel="icon" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0F2942" />
  <script>
    // Тема применяется до первой отрисовки — иначе при тёмной теме
    // страница на мгновение мигнёт светлым фоном.
    try {
      if (localStorage.getItem('sw-theme') === 'dark') {
        document.documentElement.classList.add('dark');
      }
    } catch (e) { /* хранилище недоступно — остаётся светлая тема */ }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
