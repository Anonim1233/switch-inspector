server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Файлы сборки содержат отпечаток содержимого в имени, поэтому
    # кешируются надолго: при изменении меняется и имя файла.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Сам index.html не кешируется: он ссылается на файлы сборки,
    # и устаревшая версия указывала бы на уже удалённые.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Адреса разделов обрабатывает приложение, а не сервер: без этого
    # переход по прямой ссылке возвращал бы ошибку.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
