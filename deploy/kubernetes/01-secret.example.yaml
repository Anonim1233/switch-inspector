# ═══════════════════════════════════════════════════════════════════════
# Секреты. ЭТОТ ФАЙЛ — ПРИМЕР, в репозиторий с реальными значениями
# попадать не должен.
#
# Создать в кластере:
#   kubectl create secret generic switch-inspector-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 48)" \
#     --from-literal=PGPASSWORD='пароль_базы' \
#     --from-literal=OIDC_CLIENT_SECRET='<секрет клиента Keycloak>'
#
# JWT_SECRET обязан быть ОДИНАКОВЫМ у всех реплик: токен, выданный
# одной, должен приниматься остальными.
# ═══════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: switch-inspector-secrets
type: Opaque
stringData:
  JWT_SECRET: "ЗАМЕНИТЬ"
  PGPASSWORD: "ЗАМЕНИТЬ"
  OIDC_CLIENT_SECRET: "ЗАМЕНИТЬ"
  NETBOX_TOKEN_READ: "ЗАМЕНИТЬ"
  NETBOX_TOKEN_WRITE: "ЗАМЕНИТЬ"
